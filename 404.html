<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>安全導向中...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="msg">正在確認社團網址，請稍候...</p>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyukWNTiEnbzMmr87n90VoXki4MPXw050wrB4lSNB08cWB9xdGqWoI3J8zbF9O1oQlk/exec";
        const DEFAULT_URL = "https://aiotfixer.github.io/"; 

        const currentPath = window.location.pathname;
        const targetKey = currentPath.replace(/^\/|\/$/g, ''); 

        if (!targetKey || targetKey === "index.html" || targetKey === "404.html") {
            window.location.href = DEFAULT_URL;
        } else {
            const ua = encodeURIComponent(navigator.userAgent);
            const ref = encodeURIComponent(document.referrer || "直接輸入");
            
            const fallback = setTimeout(() => {
                window.location.replace(DEFAULT_URL);
            }, 5000);

            fetch(`${GAS_URL}?key=${encodeURIComponent(targetKey)}&ua=${ua}&ref=${ref}`)
            .then(res => res.json())
            .then(result => {
                clearTimeout(fallback);
                if (result.target) {
                    window.location.replace(result.target);
                } else {
                    document.getElementById('msg').innerText = "找不到對應的社團網頁...";
                    setTimeout(() => { window.location.replace(DEFAULT_URL); }, 1500);
                }
            })
            .catch(err => {
                console.error("系統錯誤:", err);
                clearTimeout(fallback);
                window.location.replace(DEFAULT_URL);
            });
        }
    </script>
</body>
</html>
