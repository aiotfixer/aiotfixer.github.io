<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>跳轉中... - NTUT AIoTFixer</title>
    <meta name="description" content="404 Not Found">
    
    <!-- 網頁 Icon 與 Manifest 設定 -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg?v=3">
    <link rel="alternate icon" href="./assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="./assets/favicon/site.webmanifest">
    
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --error-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        /* 檔案與Logo樣式 */
        .profile {
            margin-bottom: 32px;
        }
        .logo-image {
            width: 128px;
            height: 128px;
            object-fit: cover;
            border-radius: 16px;
            margin: 0 auto 16px;
            display: block;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2),
                        0 0 8px 1px rgba(255, 255, 255, 0.1);
        }
        .logo-image:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.25),
                        0 0 12px 2px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        /* 狀態卡片樣式 */
        .status-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        /* 載入轉圈動畫 */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        /* 狀態文字與錯誤文字 */
        #msg-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        #error-title {
            display: none;
            color: var(--error-color);
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        #msg {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }
        /* 回到首頁按鈕樣式 (比照首頁 link-card 風格) */
        .home-btn {
            display: none; /* 預設隱藏，由 JS 控制顯示 */
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.25s ease;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-top: 8px;
        }
        .home-btn:hover {
            transform: translateY(-2px);
            background-color: #2563eb;
            border-color: #3b82f6;
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
        }
        footer {
            margin-top: 48px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="./assets/favicon/Logo.svg" class="logo-image" alt="Logo">
            <h1>北科智慧家電維修社</h1>
            <p class="subtitle">NTUT AIoTFixer</p>
        </div>
        
        <div class="status-card">
            <div class="loader" id="loader"></div>
            <div id="msg-container">
                <div id="error-title">404 Not Found</div>
                <p id="msg">正在解析網址並跳轉...</p>
            </div>
            <a href="https://aiotfixer.github.io/" class="home-btn" id="home-btn">回到首頁</a>
        </div>

        <footer>
            &copy; <span id="year"></span> NTUT AIoTFixer. All Rights Reserved.
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const GAS_URL = "https://script.google.com/macros/s/AKfycbyukWNTiEnbzMmr87n90VoXki4MPXw050wrB4lSNB08cWB9xdGqWoI3J8zbF9O1oQlk/exec";
        const DEFAULT_URL = "https://aiotfixer.github.io/";

        const currentPath = window.location.pathname;
        const targetKey = currentPath.replace(/^\/|\/$/g, '');

        function showNotFoundError() {
            document.title = "404 找不到網頁 - NTUT AIoTFixer";
            document.getElementById('loader').style.display = 'none';
            document.getElementById('error-title').style.display = 'block'; 
            document.getElementById('msg').innerText = "抱歉，找不到您請求的頁面或短網址。"; 
            
            // 使用 flex 顯示，確保樣式與首頁 link-card 完全一致
            document.getElementById('home-btn').style.display = 'flex';
        }

        if (!targetKey || targetKey === "index.html" || targetKey === "404.html") {
            window.location.href = DEFAULT_URL;
        } else {
            const ua = encodeURIComponent(navigator.userAgent);
            const ref = encodeURIComponent(document.referrer || "");
            
            const fallback = setTimeout(() => {
                showNotFoundError();
            }, 5000);

            fetch(`${GAS_URL}?key=${encodeURIComponent(targetKey)}&ua=${ua}&ref=${ref}`)
            .then(res => res.json())
            .then(result => {
                clearTimeout(fallback); 
                if (result.target) {
                    window.location.replace(result.target); 
                } else {
                    showNotFoundError(); 
                }
            })
            .catch(err => {
                console.error("連線錯誤:", err);
                clearTimeout(fallback);
                showNotFoundError(); 
            });
        }
    </script>
</body>
</html>
