<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>安全導向中...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="msg">正在確認社團網址，請稍候...</p>

    <script>
    const GAS_URL = "https://script.google.com/macros/s/XXXXXX/exec";
    const DEFAULT_URL = "https://github.com/"; 

    const currentPath = window.location.pathname;
    const targetKey = currentPath.replace(/^\/|\/$/g, '').toLowerCase(); 

    if (!targetKey || targetKey === "index.html" || targetKey === "404.html") {
        window.location.href = DEFAULT_URL;
    } else {
        const cachedUrl = localStorage.getItem(`url_${targetKey}`);
        const ua = encodeURIComponent(navigator.userAgent);
        const ref = encodeURIComponent(document.referrer || "直接輸入");
        const fetchUrl = `${GAS_URL}?key=${encodeURIComponent(targetKey)}&ua=${ua}&ref=${ref}`;

        if (cachedUrl) {
            window.location.replace(cachedUrl);
            fetch(fetchUrl, { keepalive: true });
        } else {
            fetch(fetchUrl)
            .then(res => res.json())
            .then(result => {
                if (result.target) {
                    localStorage.setItem(`url_${targetKey}`, result.target);
                    window.location.replace(result.target);
                } else {
                    window.location.replace(DEFAULT_URL);
                }
            })
            .catch(() => window.location.replace(DEFAULT_URL));
        }
    }
</script>
</body>
</html>
