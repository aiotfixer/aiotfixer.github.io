<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳轉中... - NTUT AIoTFixer</title>
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        /* 檔案與Logo樣式 */
        .profile {
            margin-bottom: 32px;
        }
        .logo-image {
            width: 128px;
            height: 128px;
            object-fit: cover;
            border-radius: 16px;
            margin: 0 auto 16px;
            display: block;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2),
                        0 0 8px 1px rgba(255, 255, 255, 0.1);
        }
        .logo-image:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.25),
                        0 0 12px 2px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        /* 載入轉圈動畫與訊息外觀 */
        .status-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        #msg {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }
        footer {
            margin-top: 48px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="./assets/Logo.svg" class="logo-image" alt="Logo">
            <h1>系統路由跳轉</h1>
            <p class="subtitle">NTUT AIoTFixer</p>
        </div>
        
        <div class="status-card">
            <div class="loader"></div>
            <p id="msg">正在解析網址並跳轉...</p>
        </div>

        <footer>
            &copy; <span id="year"></span> NTUT AIoTFixer. All Rights Reserved.
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const GAS_URL = "https://script.google.com/macros/s/AKfycbyukWNTiEnbzMmr87n90VoXki4MPXw050wrB4lSNB08cWB9xdGqWoI3J8zbF9O1oQlk/exec";
        const DEFAULT_URL = "https://aiotfixer.github.io/";

        const currentPath = window.location.pathname;
        const targetKey = currentPath.replace(/^\/|\/$/g, '');

        if (!targetKey || targetKey === "index.html" || targetKey === "404.html") {
            window.location.href = DEFAULT_URL;
        } else {
            const ua = encodeURIComponent(navigator.userAgent);
            const ref = encodeURIComponent(document.referrer || "");
            
            const fallback = setTimeout(() => {
                window.location.replace(DEFAULT_URL);
            }, 5000);

            fetch(`${GAS_URL}?key=${encodeURIComponent(targetKey)}&ua=${ua}&ref=${ref}`)
            .then(res => res.json())
            .then(result => {
                clearTimeout(fallback);
                if (result.target) {
                    window.location.replace(result.target);
                } else {
                    document.getElementById('msg').innerText = "找不到對應的短網址，即將返回首頁...";
                    setTimeout(() => { window.location.replace(DEFAULT_URL); }, 1500);
                }
            })
            .thenCatch(err => {
                console.error("連線錯誤:", err);
                clearTimeout(fallback);
                window.location.replace(DEFAULT_URL);
            });
        }
    </script>
</body>
</html>
