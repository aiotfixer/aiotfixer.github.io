<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="./assets/Logo.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北科智慧家電維修社</title>
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* 大頭貼/Logo 區域 */
        .profile {
            margin-bottom: 32px;
        }

        .logo-image {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: block;
            border: 2px solid rgba(52, 152, 219, 0.5);
            box-shadow: 0 10px 25px -5px rgba(52, 152, 219, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 連結按鈕區域 */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* 滑鼠懸停特效 */
        .link-card:hover {
            transform: translateY(-2px);
            background-color: #2563eb;
            border-color: #3b82f6;
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.5);
        }

        /* 頁尾資訊 */
        footer {
            margin-top: 48px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* 動態科技線條裝飾（可選） */
        .system-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #2ecc71;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="profile">
            <img src="./assets/Logo.png" class="logo-image" alt="Logo">
            <h1>北科智慧家電維修社</h1>
            <p class="subtitle">NTUT AIoTFixer</p>
        </div>

        <div class="links-group">
            
            <a href="./fb" class="link-card">
                Facebook 官方粉絲專頁
            </a>
            
            <a href="./ig" class="link-card">
                Instagram 精彩日常
            </a>
            
            <a href="./latest" class="link-card">
                活動報名
            </a>
            
        </div>

        <footer>
            &copy; 2026 北科智慧家電維修社. All Rights Reserved.
        </footer>
        
    </div>

</body>
</html>
